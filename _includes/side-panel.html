<header class="site-header" data-site-header>
  <div class="site-header__inner shell">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="返回 {{ site.title }} 首页">
      <img class="site-brand__avatar" src="{{ '/images/avatar-profile.jpg' | relative_url }}" alt="">
      <span class="site-brand__text">
        <strong>{{ site.title }}</strong>
        <small>{{ site.avatarDesc }}</small>
      </span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" data-nav-toggle>
      <span class="sr-only">打开导航</span>
      <span></span><span></span><span></span>
    </button>

    <nav id="site-navigation" class="site-nav" aria-label="主要导航" data-site-nav>
      {% for item in site.nav %}
      <a href="{{ item.url | relative_url }}" {% if page.url == item.url or page.permalink == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      <a class="site-nav__github" href="https://github.com/{{ site.social.github }}" target="_blank" rel="noreferrer">
        GitHub
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 4h10.5v10.5h-2V7.4l-8.8 8.8-1.4-1.4L12.6 6H5.5V4Z"/></svg>
      </a>
      <button class="theme-toggle" type="button" aria-label="切换深色模式" title="切换深色模式" data-theme-toggle>
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 15.2A8.5 8.5 0 0 1 8.8 3.3 8.5 8.5 0 1 0 20.7 15.2Z"/></svg>
      </button>
    </nav>
  </div>
</header>
