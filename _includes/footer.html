<footer class="site-footer">
  <div class="site-footer__inner shell">
    <div>
      <a class="site-footer__brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <p>{{ site.description }}</p>
    </div>
    <div class="site-footer__links">
      <a href="{{ '/archive/' | relative_url }}">文章</a>
      <a href="{{ '/about/' | relative_url }}">关于</a>
      <a href="https://github.com/{{ site.social.github }}" target="_blank" rel="noreferrer">GitHub</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
    <p class="site-footer__copyright">© <span data-current-year>{{ site.time | date: '%Y' }}</span> {{ site.author }} · Built with Jekyll</p>
  </div>
</footer>
