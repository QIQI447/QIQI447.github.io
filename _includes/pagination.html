{% if paginator.total_pages > 1 %}
<nav class="pagination" aria-label="文章分页">
  {% if paginator.previous_page %}
  <a href="{{ paginator.previous_page_path | relative_url }}">← 更新</a>
  {% else %}<span></span>{% endif %}
  <span>{{ paginator.page }} / {{ paginator.total_pages }}</span>
  {% if paginator.next_page %}
  <a href="{{ paginator.next_page_path | relative_url }}">更早 →</a>
  {% else %}<span></span>{% endif %}
</nav>
{% endif %}
