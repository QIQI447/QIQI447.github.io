---
layout: default
---

<header class="page-hero shell">
  <p class="eyebrow"><span></span> {{ page.kicker | default: 'QIQI447' }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="page-hero__description">{{ page.description }}</p>{% endif %}
</header>

<article class="post-container shell">
  <div class="post prose">
    {{ content }}
  </div>
</article>
