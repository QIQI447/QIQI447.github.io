# Site identity
title: 琦琦
subtitle: 个人主页
description: 记录学习、项目与持续发生的想法。
author: 琦琦
avatarTitle: 琦琦
avatarDesc: Explore · Build · Share

# GitHub Pages user site: https://qiqi447.github.io/
url: "https://qiqi447.github.io"
baseurl: ""
repository: QIQI447/QIQI447.github.io
version: "20260809-9"
lang: zh-CN
timezone: Asia/Shanghai

enableToc: true

social:
  github: QIQI447

blog_button:
  title: 阅读文章
  description: 查看最新文章

nav:
  - { title: 首页, description: home, url: '/' }
  - { title: 文章, description: archive, url: '/archive/' }
  - { title: 标签, description: tags, url: '/tags/' }
  - { title: 关于, description: about, url: '/about/' }

permalink: /:year/:month/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  math_engine: mathjax
  math_engine_opts:
    preview: false

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

paginate: 8
paginate_path: "page/:num/"

# The fork contains the upstream author's example posts. Keep the source files
# for reference, but do not publish them as 琦琦's work.
defaults:
  - scope: { path: "_posts/Course_NeuralNetwork", type: posts }
    values: { published: false }
  - scope: { path: "_posts/Course_Optoelectronics", type: posts }
    values: { published: false }
  - scope: { path: "_posts/LLM", type: posts }
    values: { published: false }
  - scope: { path: "_posts/Work_Diary", type: posts }
    values: { published: false }
  - scope: { path: "_posts/interview", type: posts }
    values: { published: false }
  - scope: { path: "_posts/isp", type: posts }
    values: { published: false }
  - scope: { path: "_posts/meta", type: posts }
    values: { published: false }
  - scope: { path: "_posts/optics", type: posts }
    values: { published: false }
  - scope: { path: "_posts/projects", type: posts }
    values: { published: false }
  - scope: { path: "_posts/travel", type: posts }
    values: { published: false }

exclude:
  - bin
  - docs
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
